# Solid Cable (DB-backed Action Cable) is used in every real environment so behavior
# stays consistent between local Docker, staging, and production — no Redis, and no
# "works on my machine because dev uses the in-process async adapter" gap.
default: &default
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

staging:
  <<: *default

production:
  <<: *default

# The `test` adapter is a Rails testing convention (synchronous, inspectable via
# `have_broadcasted_to`), not a real backend — every environment that actually runs
# the app uses solid_cable above, so this doesn't reintroduce a dev/prod gap.
test:
  adapter: test
